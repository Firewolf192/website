<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Christmas Webside</title>
        <link rel="stylesheet" href="index.css">
        <script src="index.js" defer></script>
    </head>

    <body>
        <main>
            <section>
               <figure class="title">
                    <img src="title_image.png" alt="Christmas" class="settings">
                        <figcaption class="text-position"> 
                            <h1 class="text-style">Merry Christmas</h1>
                        </figcaption>
               </figure>
            </section>
            <article>
                <div class="stuff">
                    <h2 id="s">Christmas stuff</h2>
                </div>
                <div class="pictures">
                    <figure class="caption">
                        <img src="christmas_tree.jpg" alt="christmas tree" class="images-style" id="tree">
                        <figcaption id="t1" class="hidden">
                            <p></p>
                            <b>Christmas tree is traditional <br/>tree in a lot of countries.<br/>Honestly without that tree <br/>Christmas barely exist, 
                            <br/>because tree is significal <br/>symbol of christmas and <br/>place when children get gifts.</b>
                        </figcaption>

                    </figure>
                    <figure class="caption">
                        <img src="gifts.jpg" alt="gifts" class="images-style" id="gifts">
                        <figcaption id="t2" class="hidden">
                            <p></p>
                            <b>Also we can't imagine<br/>Christmas without gifts,<br/>at least Children. Gifts<br/> make children happy <br/>and they feel beautiful <br/>Christmas climate.
                            Of <br/>course they have no clue <br/>what is the real reason <br/>that gifts spawn under <br/>christmas tree.</b>
                        </figcaption>
                    </figure>
                    <figure class="caption">
                        <img src="santa_clous.jpg" alt="santa clous" class="images-style" id="claus">
                        <figcaption id="t3" class="hidden">
                            <p></p>
                            <b>Santa Claus always was <br/> spirit of Christmas <br/> who gives children gifts <br/> and make them happy <br/> unless children realize <br/> parents have been doing <br/> his work all the time. <br/>
                            But it always was cool <br/> part of them childhood. <br/> Especially when they <br/> have been doing cookies <br/> and prepare milk for <br/> Santa Claus.</b>
                        </figcaption>
                    </figure>
                </div>
            </article>
            <section>
                <div class="table-position">
                    <figure class="caption">
                        <img src="table.jpg" alt="table" class="table-style">

                        <figcaption class="color">
                            <p></p>
                            One of the most important Christmas stuff<br/>is Christmas Eve table, that's a lot of meal<br/> different kinds. But in Poland mainly we <br/>have, fish, pierogi, soups.
                        </figcaption>
                    </figure>
                </div>
            </section>
        </main>
    </body>
</html>
